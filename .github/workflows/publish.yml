name: publish

# Publica @exponencial/iso-remediacao no npm via OIDC "Trusted Publishing".
#
# Segurança (por que este workflow é assim):
#   - Sem token de longa duração. A identidade efêmera do job (OIDC) é trocada
#     por uma credencial de publish no instante da publicação; a procedência
#     (provenance, "build attestation") é assinada automaticamente. Não há
#     segredo a vazar do GitHub.
#   - Menor privilégio: nenhum escopo por padrão; o job só pede id-token+contents.
#   - Actions fixadas por SHA de commit (não por tag móvel).
#   - Gate humano: dispara quando uma Release é publicada, e o environment
#     "npm-publish" exige aprovação antes de publicar.
#
# Pré-requisito: registrar no npm um Trusted Publisher para este pacote,
# repositório, workflow filename "publish.yml" e environment "npm-publish".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Atualiza npm
        run: npm install -g npm@11.16.0

      - name: Confere versão da release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="${TAG#v}"
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "::error::package.json ($PKG_VERSION) != tag da release ($EXPECTED)"
            exit 1
          fi
          echo "versão confere: $PKG_VERSION"

      - name: Valida pacote
        run: |
          node --check remediate.mjs
          node bin/cli.mjs --help
          npm pack --dry-run

      - name: Publish
        run: npm publish --access public
